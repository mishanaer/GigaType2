name: Build Windows app (unsigned)

# Builds the full GigaType desktop app for Windows x64 on a cloud runner
# (windows-latest already has Node, Python and VS Build Tools), bundling the
# locally-built GigaAM sidecar. Produces an unsigned NSIS installer + portable
# .exe as a downloadable artifact — no local Windows toolchain required.
#
# Manual only: it's a heavy build (downloads several hundred MB of model/runtime
# binaries and takes ~15-25 min), so it does not run on every push.

on:
  workflow_dispatch: {}

jobs:
  build-app:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: openwhispr
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: openwhispr/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # Vite needs the win32 native optional deps that npm ci may skip on a
      # different host arch; --no-save keeps package-lock.json untouched.
      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Build GigaAM sidecar (win-x64)
        run: npm run build:gigaam-sidecar:win

      # prebuild:win (auto pre-hook) downloads llama-server / qdrant / sherpa /
      # vad / diarization / nircmd / windows helper binaries, then
      # electron-builder packages the unsigned NSIS installer + portable exe.
      - name: Build Windows app (unsigned)
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer + portable
        uses: actions/upload-artifact@v4
        with:
          name: gigatype-windows-app
          path: |
            openwhispr/dist/*.exe
            openwhispr/dist/*.blockmap
            openwhispr/dist/latest.yml
          if-no-files-found: error
