name: Build Windows Key Listener

# Builds the push-to-talk key listener from openwhispr/resources/windows-key-listener.c
# and publishes it as a `windows-key-listener-v*` release in THIS repo.
# openwhispr/scripts/download-windows-key-listener.js prefers these releases over
# the upstream ones, so Windows app builds pick the patched binary up automatically.
# NOTE: must live at the repo root — workflows under openwhispr/.github/ never trigger.

on:
  push:
    paths:
      - 'openwhispr/resources/windows-key-listener.c'
      - '.github/workflows/build-windows-key-listener.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.1.0)'
        required: false
        default: '1.1.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Windows Key Listener
        run: |
          cl /O2 /nologo openwhispr/resources/windows-key-listener.c /Fe:windows-key-listener.exe user32.lib
        shell: cmd

      - name: Verify binary
        run: |
          if (Test-Path "windows-key-listener.exe") {
            Write-Host "Binary built successfully"
            Get-Item "windows-key-listener.exe" | Select-Object Name, Length
          } else {
            Write-Error "Binary not found"
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path windows-key-listener.exe -DestinationPath windows-key-listener-win32-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-key-listener
          path: windows-key-listener-win32-x64.zip

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-key-listener-v${{ inputs.version || '1.1.0' }}
          name: Windows Key Listener v${{ inputs.version || '1.1.0' }}
          body: |
            Prebuilt Windows key listener binary for Push-to-Talk.

            Includes Start-menu suppression for hotkeys that use the Win modifier
            (dummy VK 0xFF injection, so releasing Ctrl+Win does not open Start).
          files: windows-key-listener-win32-x64.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
