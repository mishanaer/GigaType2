[package]
name = "type-protected-gigaam"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
build = "build.rs"

[features]
model-packaging = ["dep:rand", "dep:tempfile"]
# Dev-only probe for the ANE encoder stdio driver; never shipped.
ane-probe = []

[[bin]]
name = "type-protected-gigaam"
path = "src/main.rs"

[[bin]]
name = "ane_probe"
path = "src/bin/ane_probe.rs"
required-features = ["ane-probe"]

# Offline operator tool; never part of the shipped application. Kept in this
# crate so the container writer and the fail-closed reader are one codebase.
[[bin]]
name = "type-model-pack"
path = "src/bin/type_model_pack.rs"
required-features = ["model-packaging"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
rand = { version = "0.8", optional = true }
tempfile = { version = "3.20", optional = true }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2.1"
hkdf = "0.12"
keyring = { version = "3.6", default-features = false }
log = "0.4"
env_logger = "0.11"
ndarray = "0.16"
once_cell = "1.21"
ort = "=2.0.0-rc.10"
realfft = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
keyring = { version = "3.6", features = ["apple-native"] }
security-framework = { version = "3.7", features = ["OSX_10_15"] }
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
] }

[dev-dependencies]
rand = "0.8"
tempfile = "3.20"

[build-dependencies]
base64 = "0.22"
