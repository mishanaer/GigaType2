<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GigaType stats</title>
<style>
  /* Дашборд модуля GigaType. Все URL относительные (мы за /p/gigatype/).
     Токены — те же, что у хаба. */
  :root { color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e;
    --muted:#898781; --border:rgba(11,11,11,0.10); --accent:#2a78d6; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7;
    --muted:#898781; --border:rgba(255,255,255,0.10); --accent:#3987e5; } }
  body { margin:0; padding:22px 26px 40px; background:var(--page); color:var(--ink);
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:17px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .filters { display:flex; gap:6px; margin-bottom:14px; }
  .filters button { font:12px/1 inherit; padding:6px 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
    cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--accent); color:#fff;
    border-color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px; max-width:960px; }
  .tile { background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; }
  .tile .v { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .tile .l { font-size:10.5px; color:var(--muted); margin-top:1px; }
  .tile.core .v { font-size:17px; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:12px; max-width:960px; margin-top:12px; }
  .chart { background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; }
  .chart h2 { font-size:12px; font-weight:600; color:var(--ink-2); margin:0 0 8px; }
  .chart svg { display:block; width:100%; height:150px; overflow:visible; }
  .chart .empty { color:var(--muted); font-size:12px; padding:24px 0 36px; }
  .bar { fill:var(--accent); }
  .bar-hit { fill:transparent; cursor:default; }
  .grid-line { stroke:var(--border); stroke-width:1; }
  .tick { fill:var(--muted); font-size:9.5px; }
  #tip { position:fixed; pointer-events:none; display:none; z-index:9;
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:6px 9px; font-size:11.5px; box-shadow:0 4px 14px rgba(0,0,0,.12); }
  #tip b { font-variant-numeric:tabular-nums; }
  details { max-width:960px; margin-top:14px; color:var(--ink-2); font-size:12px; }
  details table { border-collapse:collapse; margin-top:8px; }
  details th, details td { text-align:right; padding:3px 12px 3px 0;
    border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
  details th:first-child, details td:first-child { text-align:left; }
</style>
</head>
<body>
  <h1>GigaType</h1>
  <div class="sub" id="sub">loading…</div>
  <div class="filters" role="group" aria-label="Period" id="filters">
    <button data-days="1">24h</button>
    <button data-days="7" aria-pressed="true">7d</button>
    <button data-days="30">30d</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="charts">
    <div class="chart"><h2>Dictations / day</h2><div id="c-dict"></div></div>
    <div class="chart"><h2>Words / day</h2><div id="c-words"></div></div>
  </div>
  <details><summary>Data table</summary><div id="table"></div></details>
  <div id="tip"></div>
<script>
'use strict';
let days = 7;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n >= 10000 ? Math.round(n / 1000) + 'k'
  : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);

function barChart(el, series, key) {
  if (!series.length || !series.some(d => d[key] > 0)) {
    el.innerHTML = '<div class="empty">no data yet</div>';
    return;
  }
  const W = 600, H = 150, padB = 16, padT = 6;
  const max = Math.max(...series.map(d => d[key]));
  const n = series.length;
  const slot = W / n, gap = Math.min(2, slot * 0.1);
  const bw = Math.max(1, Math.min(slot - gap, 40));
  const y = v => padT + (H - padB - padT) * (1 - v / max);
  let s = `<line class="grid-line" x1="0" y1="${H - padB}" x2="${W}" y2="${H - padB}"/>`;
  series.forEach((d, i) => {
    const x = slot * i + (slot - bw) / 2, top = y(d[key]);
    const h = Math.max(H - padB - top, d[key] > 0 ? 2 : 0);
    const r = Math.min(4, bw / 2, h);
    /* скругление только у вершины, низ прижат к базовой линии */
    s += `<path class="bar" d="M${x} ${H - padB} v${-(h - r)} q0 ${-r} ${r} ${-r} h${bw - 2 * r} q${r} 0 ${r} ${r} v${h - r} z"/>`;
    s += `<rect class="bar-hit" x="${slot * i}" y="0" width="${slot}" height="${H - padB}" data-day="${esc(d.day)}" data-v="${d[key]}"/>`;
    const every = Math.ceil(n / 8);
    if (i % every === 0)
      s += `<text class="tick" x="${slot * i + slot / 2}" y="${H - 4}" text-anchor="middle">${esc(d.day.slice(5))}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="daily values">${s}</svg>`;
  el.querySelectorAll('.bar-hit').forEach(r => {
    r.addEventListener('mousemove', e => {
      const t = $('tip');
      t.style.display = 'block';
      t.innerHTML = `${esc(r.dataset.day)} · <b>${fmt(+r.dataset.v)}</b>`;
      t.style.left = Math.min(e.clientX + 12, innerWidth - 120) + 'px';
      t.style.top = (e.clientY - 34) + 'px';
    });
    r.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; });
  });
}

async function load() {
  try {
    const [s, ts] = await Promise.all([
      fetch(`summary?days=${days}`, { cache: 'no-store' }).then(r => r.json()),
      fetch(`timeseries?days=${days}`, { cache: 'no-store' }).then(r => r.json()),
    ]);
    $('sub').textContent = `updated ${s.updated_at} · window ${s.window_days}d`;
    const win = s.window_days === 1 ? '24h' : `${s.window_days}d`;
    const core = [
      { label: 'Installs', value: fmt(s.installs) },
      { label: `Devices ${win}`, value: fmt(s.dau) },
      { label: `Events ${win}`, value: fmt(s.events) },
      { label: `Errors ${win}`, value: fmt(s.errors) },
    ];
    $('tiles').innerHTML =
      (s.metrics || []).map(m => `<div class="tile"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('') +
      core.map(m => `<div class="tile core"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('');
    barChart($('c-dict'), ts.series, 'dictations');
    barChart($('c-words'), ts.series, 'words');
    $('table').innerHTML = ts.series.length
      ? '<table><tr><th>day</th><th>dictations</th><th>words</th><th>devices</th><th>errors</th></tr>'
        + ts.series.map(d => `<tr><td>${esc(d.day)}</td><td>${d.dictations}</td><td>${d.words}</td><td>${d.devices}</td><td>${d.errors}</td></tr>`).join('')
        + '</table>'
      : 'no data yet';
  } catch (e) {
    $('sub').textContent = 'load failed: ' + e;
  }
}

$('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-days]');
  if (!b) return;
  days = +b.dataset.days;
  document.querySelectorAll('#filters button').forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  load();
});
load();
</script>
</body>
</html>
